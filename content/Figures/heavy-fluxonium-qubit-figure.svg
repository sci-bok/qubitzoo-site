<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    .title { font: 700 28px Arial, Helvetica, sans-serif; fill: black; }
    .panel { font: 700 28px Arial, Helvetica, sans-serif; fill: black; }
    .text { font: 24px Arial, Helvetica, sans-serif; fill: black; }
    .small { font: 20px Arial, Helvetica, sans-serif; fill: black; }
    .tiny { font: 16px Arial, Helvetica, sans-serif; fill: #555; }
    .blue { fill: #4A7C9B; }
  </style>

  <text x="40" y="50" class="panel">(a)</text>
  <text x="270" y="50" class="title" text-anchor="middle">Circuit</text>
  <text x="560" y="50" class="panel">(b)</text>
  <text x="805" y="50" class="title" text-anchor="middle">Half-flux localized basis</text>
  <text x="1090" y="50" class="panel">(c)</text>
  <text x="1335" y="50" class="title" text-anchor="middle">Protected qubit</text>

  <!-- Panel A: more standard loop -->
  <line x1="130" y1="150" x2="410" y2="150" stroke="black" stroke-width="5"/>
  <line x1="130" y1="150" x2="130" y2="390" stroke="black" stroke-width="5"/>
  <line x1="410" y1="150" x2="410" y2="390" stroke="black" stroke-width="5"/>
  <line x1="130" y1="390" x2="230" y2="390" stroke="black" stroke-width="5"/>
  <line x1="310" y1="390" x2="410" y2="390" stroke="black" stroke-width="5"/>
  <!-- JJ on bottom branch -->
  <rect x="230" y="362" width="80" height="56" fill="white" stroke="black" stroke-width="3"/>
  <line x1="242" y1="372" x2="298" y2="408" stroke="black" stroke-width="4"/>
  <line x1="298" y1="372" x2="242" y2="408" stroke="black" stroke-width="4"/>
  <text x="270" y="448" class="small" text-anchor="middle">JJ</text>
  <!-- superinductor on top branch -->
  <path d="M 185 150 C 200 135, 220 135, 235 150 C 250 165, 270 165, 285 150 C 300 135, 320 135, 335 150 C 350 165, 370 165, 385 150" fill="none" stroke="black" stroke-width="5"/>
  <text x="270" y="118" class="small" text-anchor="middle">super-L</text>
  <!-- shunt capacitor across JJ nodes -->
  <line x1="170" y1="270" x2="230" y2="270" stroke="black" stroke-width="5"/>
  <line x1="310" y1="270" x2="370" y2="270" stroke="black" stroke-width="5"/>
  <line x1="230" y1="240" x2="230" y2="300" stroke="black" stroke-width="5"/>
  <line x1="310" y1="240" x2="310" y2="300" stroke="black" stroke-width="5"/>
  <text x="270" y="330" class="small blue" text-anchor="middle">large shunt C -> low EC</text>
  <!-- flux arrow through full loop -->
  <circle cx="270" cy="270" r="88" fill="none" stroke="#4A7C9B" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M 345 225 A 88 88 0 0 1 352 320" fill="none" stroke="#4A7C9B" stroke-width="4"/>
  <polygon points="348,319 366,326 351,340" fill="#4A7C9B"/>
  <text x="270" y="520" class="small blue" text-anchor="middle">Phi_ext ~ Phi0/2</text>
  <text x="270" y="548" class="small" text-anchor="middle">heavy fluxonium = same loop, larger total C</text>

  <!-- Panel B -->
  <text x="805" y="95" class="text blue" text-anchor="middle">double well near Phi_ext ~ Phi0/2</text>
  <path d="M 610 360 C 660 150, 710 150, 760 360 C 790 470, 810 470, 840 360 C 890 150, 940 150, 990 360" fill="none" stroke="black" stroke-width="5"/>
  <text x="610" y="285" class="small">potential</text>
  <text x="952" y="390" class="small">phase</text>
  <path d="M 680 350 C 700 308, 725 308, 745 350 C 725 355, 700 355, 680 350 Z" fill="#4A7C9B" fill-opacity="0.30" stroke="#4A7C9B" stroke-width="4"/>
  <path d="M 855 350 C 875 308, 900 308, 920 350 C 900 355, 875 355, 855 350 Z" fill="#4A7C9B" fill-opacity="0.30" stroke="#4A7C9B" stroke-width="4"/>
  <text x="712" y="395" class="text" text-anchor="middle">|L&gt;</text>
  <text x="887" y="395" class="text" text-anchor="middle">|R&gt;</text>
  <line x1="735" y1="438" x2="865" y2="438" stroke="#777" stroke-width="3" stroke-dasharray="10 8"/>
  <polygon points="735,438 748,432 748,444" fill="#777"/>
  <polygon points="865,438 852,432 852,444" fill="#777"/>
  <text x="805" y="430" class="small" text-anchor="middle">weak tunneling</text>
  <text x="805" y="482" class="small" text-anchor="middle">useful localized basis</text>
  <text x="805" y="515" class="small" text-anchor="middle">not exact energy eigenstates</text>

  <!-- Panel C -->
  <text x="1160" y="150" class="small">|0&gt; ~ (|L&gt; + |R&gt;) / sqrt(2)</text>
  <text x="1160" y="182" class="tiny">even state at the sweet spot</text>
  <text x="1160" y="240" class="small">|1&gt; ~ (|L&gt; - |R&gt;) / sqrt(2)</text>
  <text x="1160" y="272" class="tiny">odd state at the sweet spot</text>
  <text x="1160" y="338" class="small blue">sweet spot -> lower flux-noise dephasing</text>
  <text x="1160" y="375" class="small blue">small &lt;0|n|1&gt; -> lower charge-coupled T1 loss</text>
  <line x1="1175" y1="420" x2="1315" y2="420" stroke="#4A7C9B" stroke-width="4"/>
  <polygon points="1315,420 1295,410 1295,430" fill="#4A7C9B"/>
  <text x="1340" y="427" class="small">reported long T1 and T2*</text>

  <rect x="1160" y="465" width="315" height="90" fill="white" stroke="black" stroke-width="3"/>
  <text x="1318" y="492" class="small" text-anchor="middle" font-weight="700">Representative published metrics</text>
  <text x="1185" y="520" class="small">T1 up to 1.5 ms</text>
  <text x="1185" y="545" class="small">T2* 1.48 ms</text>
  <text x="1360" y="533" class="small">1Q gate &gt; 99.99%</text>
</svg>
